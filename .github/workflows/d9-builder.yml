name: Build and Push d9 (auto-update)

on:
  schedule:
    - cron: '0 12 * * 1'   # every Monday at 12:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if the latest release is already published'
        required: false
        type: boolean
        default: false
      dockerfile_path:
        description: 'Path to Dockerfile relative to repo root ("auto" = Dockerfile, then docker/Dockerfile)'
        required: false
        type: string
        default: 'auto'
      build_args:
        description: 'Build arguments (one per line, KEY=VALUE). Leave empty for Dockerfile defaults.'
        required: false
        type: string
        default: ''

env:
  UPSTREAM_REPO: LaWebcapsule/d9
  UPSTREAM_URL: https://github.com/LaWebcapsule/d9
  IMAGE_NAME: driftywinds/d9
  # GHCR is always pushed to (it is also the source of truth for the version check).
  PUSH_TO_DOCKERHUB: 'false'
  PUSH_TO_QUAY: 'false'

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
    steps:
      - name: Get current version tag from GHCR
        id: current
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get a registry pull token (works for public and private packages)
          TOKEN=$(curl -s -u "${GHCR_USER}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_NAME}:pull" | jq -r '.token // empty')

          TAGS=""
          if [[ -n "$TOKEN" ]]; then
            TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://ghcr.io/v2/${IMAGE_NAME}/tags/list?n=1000" | jq -r '.tags[]?' || true)
          fi
          echo "Tags found on ghcr.io/${IMAGE_NAME}:"
          echo "${TAGS:-<none>}"

          # Highest vX.Y.Z tag (ignores "latest")
          CURRENT=$(echo "$TAGS" | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1 || true)
          echo "Current published version: ${CURRENT:-<none>}"
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name // empty')

          if [[ -z "$LATEST" ]]; then
            echo "::error::Could not determine latest release of ${UPSTREAM_REPO}"
            exit 1
          fi
          echo "Latest upstream release: $LATEST"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.tag }}
          LATEST: ${{ steps.upstream.outputs.tag }}
          FORCE: ${{ inputs.force_build }}
        run: |
          echo "release_tag=$LATEST" >> "$GITHUB_OUTPUT"

          if [[ "$FORCE" == "true" ]]; then
            echo "Force build requested."
            SHOULD_BUILD=true
          elif [[ -z "$CURRENT" ]]; then
            echo "No published version found, building $LATEST."
            SHOULD_BUILD=true
          elif [[ "$CURRENT" == "$LATEST" ]]; then
            echo "Already up to date ($CURRENT). Nothing to do."
            SHOULD_BUILD=false
          elif [[ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n1)" == "$LATEST" ]]; then
            echo "New release available: $CURRENT -> $LATEST"
            SHOULD_BUILD=true
          else
            echo "Published version ($CURRENT) is newer than upstream release ($LATEST). Nothing to do."
            SHOULD_BUILD=false
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

          {
            echo "## Version check"
            echo "- Published: \`${CURRENT:-none}\`"
            echo "- Upstream: \`$LATEST\`"
            echo "- Build needed: **$SHOULD_BUILD**"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}

    steps:
      - name: Clone upstream repository at release tag
        run: |
          git clone --depth 1 --branch "$RELEASE_TAG" "${UPSTREAM_URL}.git" ./target-repo
          cd ./target-repo
          echo "REPO_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "REPO_SHORT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Detect Dockerfile location
        id: dockerfile
        env:
          INPUT_PATH: ${{ inputs.dockerfile_path }}
        run: |
          cd ./target-repo
          DOCKERFILE_PATH="${INPUT_PATH:-auto}"

          if [[ "$DOCKERFILE_PATH" == "auto" ]]; then
            if [[ -f "Dockerfile" ]]; then
              DOCKERFILE_PATH="Dockerfile"
            elif [[ -f "docker/Dockerfile" ]]; then
              DOCKERFILE_PATH="docker/Dockerfile"
            else
              echo "::error::No Dockerfile found in root or docker/ directory"
              exit 1
            fi
          elif [[ ! -f "$DOCKERFILE_PATH" ]]; then
            echo "::error::Specified Dockerfile not found at: $DOCKERFILE_PATH"
            exit 1
          fi

          echo "Using Dockerfile: $DOCKERFILE_PATH"
          echo "path=$DOCKERFILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        if: env.PUSH_TO_QUAY == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Generate tags
        id: meta
        run: |
          ALL_TAGS=""
          for tag in latest "$RELEASE_TAG"; do
            ALL_TAGS+="ghcr.io/${IMAGE_NAME}:${tag},"
            if [[ "$PUSH_TO_DOCKERHUB" == "true" ]]; then
              ALL_TAGS+="${IMAGE_NAME}:${tag},"
            fi
            if [[ "$PUSH_TO_QUAY" == "true" ]]; then
              ALL_TAGS+="quay.io/${IMAGE_NAME}:${tag},"
            fi
          done
          ALL_TAGS="${ALL_TAGS%,}"

          echo "tags=$ALL_TAGS" >> "$GITHUB_OUTPUT"
          echo "Generated tags: $ALL_TAGS"

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: ./target-repo
          file: ./target-repo/${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Built from ${{ env.UPSTREAM_URL }}
            org.opencontainers.image.url=${{ env.UPSTREAM_URL }}
            org.opencontainers.image.source=${{ env.UPSTREAM_URL }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.REPO_COMMIT }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERFILE: ${{ steps.dockerfile.outputs.path }}
        run: |
          {
            echo "## Build Summary"
            echo "**Repository:** ${UPSTREAM_URL}"
            echo "**Release:** ${RELEASE_TAG}"
            echo "**Commit:** ${REPO_SHORT_COMMIT}"
            echo "**Dockerfile:** ${DOCKERFILE}"
            echo ""
            echo "### Published tags:"
            echo "$TAGS" | tr ',' '\n' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
